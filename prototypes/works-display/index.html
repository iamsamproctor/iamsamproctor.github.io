<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype • Works Display</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000000;
      }

      a,
      footer {
        color: #797979;
      }

      footer {
        position: fixed;
        margin: 10px;
        bottom: 0;
        left: 0;
        z-index: 1;
      }

      .screen-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
        z-index: 20;
      }

      .screen-modal-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      /* Position/size are driven directly from JS (left/top/width/height)
         so the panel can FLIP-animate from the clicked plane's exact
         on-screen rect to the centered modal layout, and back again. */
      .screen-modal-panel {
        position: fixed;
        border-radius: 4px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }

      .screen-modal-panel img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>

  <body>
    <footer><a href="../../index.html">&larr; back to prototypes</a></footer>

    <div class="screen-modal-backdrop" id="screen-modal-backdrop">
      <div class="screen-modal-panel" id="screen-modal-panel">
        <img id="screen-modal-image" alt="" />
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { TransformControls } from "three/addons/controls/TransformControls.js";

      const debugMode = new URLSearchParams(window.location.search).has(
        "debug",
      );

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0, 6.5);
      camera.lookAt(0, 0, 0);
      camera.rotation.order = "YXZ";

      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(new THREE.Color(0x000000), 1);

      const spark = new SparkRenderer({ renderer });
      scene.add(spark);

      document.body.appendChild(renderer.domElement);

      // TEMP: on-screen camera position readout, remove when done debugging.
      const cameraPositionReadout = document.createElement("div");
      Object.assign(cameraPositionReadout.style, {
        position: "fixed",
        bottom: "10px",
        right: "10px",
        margin: "0",
        padding: "6px 10px",
        background: "rgba(0, 0, 0, 0.6)",
        color: "#0f0",
        font: "12px/1.4 monospace",
        pointerEvents: "none",
        whiteSpace: "pre",
        zIndex: "10",
      });
      document.body.appendChild(cameraPositionReadout);

      window.addEventListener("resize", onWindowResize, false);
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      // Background environment
      const background = new SplatMesh({
        url: "../../assets/splats/driveway.spz",
      });
      background.rotation.z = Math.PI; // flip upside down
      background.scale.setScalar(2.8); // 30% bigger, then another 60% on top
      background.position.y = 1;
      scene.add(background);

      // Centered subject
      const centerpiece = new SplatMesh({ url: "../../assets/splats/mom.spz" });
      centerpiece.quaternion.set(0, 0, 0, 0);
      centerpiece.position.set(0, 0, 0);
      scene.add(centerpiece);

      // Invisible hitbox so the centerpiece is clickable regardless of the
      // splat's actual (irregular) geometry.
      const centerpieceHitbox = new THREE.Mesh(
        new THREE.SphereGeometry(0.9, 16, 16),
        new THREE.MeshBasicMaterial(),
      );
      centerpieceHitbox.visible = false;
      centerpieceHitbox.position.copy(centerpiece.position);
      scene.add(centerpieceHitbox);

      // Curved wall of screens, arced in front of the centerpiece toward the camera.
      const SPRITE_FILES = [
        "1.png",
        "2.png",
        "3.png",
        "4.png",
        "5.jpg",
        "6.jpg",
        "7.png",
        "8.png",
        "1.png",
        "2.png",
        "3.png",
        "4.png",
        "5.jpg",
        "6.jpg",
        "7.png",
        "8.png",
      ];
      const SCREEN_COUNT = SPRITE_FILES.length;
      const ARC_RADIUS = 1; // ~5 feet, in meters
      const ARC_SPAN = Math.PI * 0.6; // how much of the circle the wall wraps around
      const SCREEN_HEIGHT = 0.5;
      const VERTICAL_SCATTER = 1;
      const WALL_HEIGHT_OFFSET = 0.25; // raises the whole wall relative to the centerpiece
      const SCREEN_GAP = 0.02; // minimum gap kept between screens, in meters
      const MAX_PLACEMENT_ATTEMPTS = 500;
      const FLOAT_AMOUNT_HORIZONTAL = 0.02; // meters of drift along the arc
      const FLOAT_AMOUNT_VERTICAL = 0.05; // meters of drift up/down
      const FLOAT_SPEED_MIN = 0.15; // Hz-ish
      const FLOAT_SPEED_MAX = 0.4;
      const HOVER_SCALE = 1.15; // how much the hovered screen grows
      const NEIGHBOR_SCALE = 0.92; // how much every other screen shrinks while one is hovered
      const NEIGHBOR_DIM_AMOUNT = 0.6; // how far non-hovered screens dim toward NEIGHBOR_DIM_COLOR
      const HOVER_TRANSITION_SMOOTHING = 10;
      const NEIGHBOR_DIM_COLOR = new THREE.Color(0x1a1a1a);
      const SCREEN_ROTATION_OFFSET = Math.PI; // flips each screen 180° on the y-axis

      // Footprints of screens already placed, in unwrapped arc coordinates:
      // u = position along the arc (approximated as arc length), v = height.
      const placedFootprints = [];

      function findOpenSpot(halfWidth, halfHeight) {
        for (let attempt = 0; attempt < MAX_PLACEMENT_ATTEMPTS; attempt++) {
          const theta = THREE.MathUtils.randFloatSpread(ARC_SPAN);
          const y =
            WALL_HEIGHT_OFFSET +
            THREE.MathUtils.randFloatSpread(VERTICAL_SCATTER);
          const u = theta * ARC_RADIUS;

          const overlapsExisting = placedFootprints.some(
            (other) =>
              Math.abs(u - other.u) < halfWidth + other.halfWidth &&
              Math.abs(y - other.v) < halfHeight + other.halfHeight,
          );

          if (!overlapsExisting) return { theta, y, u };
        }
        return null; // giving up; caller places it wherever it last tried
      }

      const textureLoader = new THREE.TextureLoader();
      const spriteTextures = await Promise.all(
        SPRITE_FILES.map((file) =>
          textureLoader.loadAsync(`../../assets/sprites/${file}`),
        ),
      );
      for (const texture of spriteTextures) {
        texture.colorSpace = THREE.SRGBColorSpace;
      }

      const screens = [];
      for (let i = 0; i < SCREEN_COUNT; i++) {
        const texture = spriteTextures[i];
        const aspect = texture.image.width / texture.image.height;
        const width = SCREEN_HEIGHT * aspect;
        const halfWidth = width / 2 + SCREEN_GAP / 2;
        const halfHeight = SCREEN_HEIGHT / 2 + SCREEN_GAP / 2;

        const spot = findOpenSpot(halfWidth, halfHeight);
        if (!spot) {
          console.warn(
            `works-display: no open spot found for screen ${i}, increase VERTICAL_SCATTER or reduce SCREEN_COUNT`,
          );
          continue;
        }
        placedFootprints.push({ u: spot.u, v: spot.y, halfWidth, halfHeight });

        const geometry = new THREE.PlaneGeometry(width, SCREEN_HEIGHT);
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide,
        });
        const screen = new THREE.Mesh(geometry, material);

        screen.position.set(
          Math.sin(spot.theta) * ARC_RADIUS,
          spot.y,
          Math.cos(spot.theta) * ARC_RADIUS,
        );
        // Default plane normal is +z; rotating by theta about Y keeps it
        // tangent to the arc and facing outward, toward the camera. The
        // extra offset flips each image 180° so it reads right-way-round.
        screen.rotation.y = spot.theta + SCREEN_ROTATION_OFFSET;

        scene.add(screen);

        const screenState = {
          mesh: screen,
          spriteFile: SPRITE_FILES[i],
          baseTheta: spot.theta,
          baseY: spot.y,
          // Material color is a multiplier over the texture; white = the
          // image at full, untinted brightness.
          baseColor: new THREE.Color(0xffffff),
          currentScale: 1,
          // Randomized per screen so the wall drifts like independent
          // floating memories rather than moving in lockstep.
          phaseH: Math.random() * Math.PI * 2,
          phaseV: Math.random() * Math.PI * 2,
          speedH: THREE.MathUtils.randFloat(FLOAT_SPEED_MIN, FLOAT_SPEED_MAX),
          speedV: THREE.MathUtils.randFloat(FLOAT_SPEED_MIN, FLOAT_SPEED_MAX),
        };
        // Lets the hover raycast (which hits the mesh) look up its state.
        screen.userData.screenState = screenState;
        screens.push(screenState);
      }

      const screenMeshes = screens.map((screen) => screen.mesh);

      // Setup mouse controls to orbit the camera around; auto-rotates on its
      // own when idle, and simply pauses whenever POV mode stops calling
      // controls.update() (see the render loop below).
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.minDistance = 2;
      controls.maxDistance = 3;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.6;
      controls.update();

      // Click the centerpiece to snap into her POV, looking out toward the
      // screens; look around with the cursor (like splat-hero), Esc to exit.
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();

      let povMode = false;
      const ORBIT_FOV = camera.fov;
      const POV_FOV = 70; // wider lens so the screen wall fits without much look-around
      const povBaseRotation = { x: 0, y: Math.PI }; // her forward is +z
      const povMaxYaw = THREE.MathUtils.degToRad(22);
      const povMaxPitch = THREE.MathUtils.degToRad(22);
      const povRotationSmoothing = 4;
      let povTargetYaw = 0;
      let povTargetPitch = 0;

      const povQuaternion = new THREE.Quaternion().setFromEuler(
        new THREE.Euler(povBaseRotation.x, povBaseRotation.y, 0, "YXZ"),
      );
      const POV_EYE_HEIGHT = 0.25; // offset above the centerpiece's origin, in meters
      const povPosition = centerpiece.position
        .clone()
        .add(new THREE.Vector3(0, POV_EYE_HEIGHT, 0));

      // Debug gizmo: drag the arrows to preview a different eye position;
      // open with ?debug in the URL. Doesn't persist — read the printed
      // position off the on-screen readout and copy it into POV_EYE_HEIGHT.
      let eyeGizmo, eyeGizmoControls;
      if (debugMode) {
        eyeGizmo = new THREE.Object3D();
        eyeGizmo.position.copy(povPosition);
        scene.add(eyeGizmo);

        eyeGizmoControls = new TransformControls(camera, renderer.domElement);
        eyeGizmoControls.setMode("translate");
        eyeGizmoControls.setSize(0.6);
        eyeGizmoControls.attach(eyeGizmo);
        scene.add(eyeGizmoControls.getHelper());

        eyeGizmoControls.addEventListener("dragging-changed", (event) => {
          controls.enabled = !event.value;
        });
      }

      const savedCameraPosition = new THREE.Vector3();
      const savedCameraQuaternion = new THREE.Quaternion();

      // Camera flight between the orbit view and the POV view. While this is
      // active, neither OrbitControls nor the POV look-around drive the camera.
      const TRANSITION_DURATION = 0.9; // seconds
      let cameraTransition = null;

      function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function startCameraTransition(
        fromPos,
        fromQuat,
        toPos,
        toQuat,
        fromFov,
        toFov,
        onComplete,
      ) {
        cameraTransition = {
          fromPos: fromPos.clone(),
          toPos: toPos.clone(),
          fromQuat: fromQuat.clone(),
          toQuat: toQuat.clone(),
          fromFov,
          toFov,
          startTime: performance.now(),
          onComplete,
        };
      }

      function enterPovMode() {
        if (povMode || cameraTransition) return;
        povMode = true;
        savedCameraPosition.copy(camera.position);
        savedCameraQuaternion.copy(camera.quaternion);

        controls.enabled = false;
        povTargetYaw = 0;
        povTargetPitch = 0;
        centerpiece.visible = false;

        startCameraTransition(
          camera.position,
          camera.quaternion,
          povPosition,
          povQuaternion,
          camera.fov,
          POV_FOV,
        );
      }

      function exitPovMode() {
        if (!povMode || cameraTransition) return;
        povMode = false;

        startCameraTransition(
          camera.position,
          camera.quaternion,
          savedCameraPosition,
          savedCameraQuaternion,
          camera.fov,
          ORBIT_FOV,
          () => {
            controls.enabled = true;
            controls.update();
            centerpiece.visible = true;
          },
        );
      }

      // Clicking a floating screen while in POV mode opens it as a flat
      // "modal" — a placeholder for the real artwork later. The panel FLIPs:
      // it snaps to the clicked plane's exact on-screen rect, then animates
      // to the centered modal layout (and reverses on close), so the 2D
      // view feels like a continuation of the 3D screen rather than a
      // separate popup.
      const screenModalBackdrop = document.getElementById(
        "screen-modal-backdrop",
      );
      const screenModalPanel = document.getElementById("screen-modal-panel");
      const screenModalImage = document.getElementById("screen-modal-image");
      const MODAL_TRANSITION_DURATION = 0.4; // seconds
      let modalOpen = false;
      let modalScreenState = null;

      // Projects a plane mesh's 4 corners into CSS pixel space, giving the
      // exact rect it occupies on screen right now (accounts for its
      // current world position/rotation/scale, not just its base size).
      function getScreenPixelRect(mesh) {
        mesh.updateMatrixWorld();
        const { width, height } = mesh.geometry.parameters;
        const halfWidth = width / 2;
        const halfHeight = height / 2;
        const corners = [
          [-halfWidth, -halfHeight],
          [halfWidth, -halfHeight],
          [halfWidth, halfHeight],
          [-halfWidth, halfHeight],
        ];

        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        const corner = new THREE.Vector3();
        for (const [x, y] of corners) {
          corner.set(x, y, 0).applyMatrix4(mesh.matrixWorld).project(camera);
          const pixelX = (corner.x * 0.5 + 0.5) * window.innerWidth;
          const pixelY = (1 - (corner.y * 0.5 + 0.5)) * window.innerHeight;
          minX = Math.min(minX, pixelX);
          maxX = Math.max(maxX, pixelX);
          minY = Math.min(minY, pixelY);
          maxY = Math.max(maxY, pixelY);
        }
        return {
          left: minX,
          top: minY,
          width: maxX - minX,
          height: maxY - minY,
        };
      }

      function getCenteredModalRect(aspect) {
        const maxHeight = window.innerHeight * 0.7;
        const maxWidth = window.innerWidth * 0.85;
        let height = maxHeight;
        let width = height * aspect;
        if (width > maxWidth) {
          width = maxWidth;
          height = width / aspect;
        }
        return {
          left: (window.innerWidth - width) / 2,
          top: (window.innerHeight - height) / 2,
          width,
          height,
        };
      }

      function applyModalRect(rect) {
        screenModalPanel.style.left = `${rect.left}px`;
        screenModalPanel.style.top = `${rect.top}px`;
        screenModalPanel.style.width = `${rect.width}px`;
        screenModalPanel.style.height = `${rect.height}px`;
      }

      function openScreenModal(screenState) {
        if (modalOpen) return;
        modalOpen = true;
        modalScreenState = screenState;

        const { width, height } = screenState.mesh.geometry.parameters;

        screenModalImage.src = `../../assets/sprites/${screenState.spriteFile}`;

        // Snap to the plane's exact current on-screen rect first, with
        // transitions off, so the swap from 3D to 2D is invisible...
        screenModalPanel.style.transition = "none";
        applyModalRect(getScreenPixelRect(screenState.mesh));
        screenModalBackdrop.classList.add("open");

        // ...then force a reflow so the browser registers that snapped
        // state before we animate away from it — otherwise both style
        // changes collapse into one and nothing appears to move.
        screenModalPanel.getBoundingClientRect();

        screenModalPanel.style.transition = `left ${MODAL_TRANSITION_DURATION}s cubic-bezier(0.22, 1, 0.36, 1), top ${MODAL_TRANSITION_DURATION}s cubic-bezier(0.22, 1, 0.36, 1), width ${MODAL_TRANSITION_DURATION}s cubic-bezier(0.22, 1, 0.36, 1), height ${MODAL_TRANSITION_DURATION}s cubic-bezier(0.22, 1, 0.36, 1)`;
        applyModalRect(getCenteredModalRect(width / height));
      }

      function closeScreenModal() {
        if (!modalOpen || !modalScreenState) return;
        const screenState = modalScreenState;
        modalOpen = false;
        modalScreenState = null;

        screenModalPanel.style.transition = `left ${MODAL_TRANSITION_DURATION}s cubic-bezier(0.4, 0, 1, 1), top ${MODAL_TRANSITION_DURATION}s cubic-bezier(0.4, 0, 1, 1), width ${MODAL_TRANSITION_DURATION}s cubic-bezier(0.4, 0, 1, 1), height ${MODAL_TRANSITION_DURATION}s cubic-bezier(0.4, 0, 1, 1)`;
        applyModalRect(getScreenPixelRect(screenState.mesh));
        screenModalBackdrop.classList.remove("open");
      }

      screenModalBackdrop.addEventListener("click", () => closeScreenModal());
      screenModalPanel.addEventListener("click", (event) =>
        event.stopPropagation(),
      );

      renderer.domElement.addEventListener("click", (event) => {
        if (cameraTransition || modalOpen) return;

        const rect = renderer.domElement.getBoundingClientRect();
        pointerNDC.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointerNDC.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);

        if (povMode) {
          const hits = raycaster.intersectObjects(screenMeshes);
          if (hits.length > 0) {
            openScreenModal(hits[0].object.userData.screenState);
          }
          return;
        }

        const hits = raycaster.intersectObject(centerpieceHitbox);
        if (hits.length > 0) enterPovMode();
      });

      window.addEventListener("pointermove", (event) => {
        pointerNDC.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(event.clientY / window.innerHeight) * 2 + 1;

        if (!povMode || modalOpen) return;
        const horizontal = THREE.MathUtils.clamp(
          (event.clientX / window.innerWidth) * 2 - 1,
          -1,
          1,
        );
        const vertical = THREE.MathUtils.clamp(
          1 - (event.clientY / window.innerHeight) * 2,
          -1,
          1,
        );
        povTargetYaw = -horizontal * povMaxYaw;
        povTargetPitch = vertical * povMaxPitch;
      });

      window.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (modalOpen) {
          closeScreenModal();
        } else {
          exitPovMode();
        }
      });

      let hoveredScreen = null;

      let previousTime = performance.now();
      renderer.setAnimationLoop(function animate(time) {
        const currentTime = performance.now();
        const deltaTime = Math.min((currentTime - previousTime) / 1000, 0.1);
        previousTime = currentTime;

        if (cameraTransition) {
          const elapsed = (currentTime - cameraTransition.startTime) / 1000;
          const linearT = Math.min(elapsed / TRANSITION_DURATION, 1);
          const easedT = easeInOutCubic(linearT);

          camera.position.lerpVectors(
            cameraTransition.fromPos,
            cameraTransition.toPos,
            easedT,
          );
          camera.quaternion.slerpQuaternions(
            cameraTransition.fromQuat,
            cameraTransition.toQuat,
            easedT,
          );
          camera.fov = THREE.MathUtils.lerp(
            cameraTransition.fromFov,
            cameraTransition.toFov,
            easedT,
          );
          camera.updateProjectionMatrix();

          if (linearT >= 1) {
            const completed = cameraTransition;
            cameraTransition = null;
            completed.onComplete?.();
          }
        } else if (povMode) {
          const smoothing = 1 - Math.exp(-povRotationSmoothing * deltaTime);
          camera.rotation.y = THREE.MathUtils.lerp(
            camera.rotation.y,
            povBaseRotation.y + povTargetYaw,
            smoothing,
          );
          camera.rotation.x = THREE.MathUtils.lerp(
            camera.rotation.x,
            povBaseRotation.x + povTargetPitch,
            smoothing,
          );
        } else {
          controls.update(deltaTime);
        }

        if (povMode && !cameraTransition && !modalOpen) {
          raycaster.setFromCamera(pointerNDC, camera);
          const hits = raycaster.intersectObjects(screenMeshes);
          hoveredScreen =
            hits.length > 0 ? hits[0].object.userData.screenState : null;
        } else {
          hoveredScreen = null;
        }

        const t = time / 1000;
        for (const screen of screens) {
          const thetaDrift =
            (Math.sin(t * screen.speedH + screen.phaseH) *
              FLOAT_AMOUNT_HORIZONTAL) /
            ARC_RADIUS;
          const theta = screen.baseTheta + thetaDrift;
          const y =
            screen.baseY +
            Math.sin(t * screen.speedV + screen.phaseV) * FLOAT_AMOUNT_VERTICAL;

          screen.mesh.position.set(
            Math.sin(theta) * ARC_RADIUS,
            y,
            Math.cos(theta) * ARC_RADIUS,
          );
          screen.mesh.rotation.y = theta + SCREEN_ROTATION_OFFSET;

          // Highlight whichever screen is under the cursor in POV mode: it
          // grows and stays full-brightness, while every other screen
          // shrinks and dims back subtly, like a spotlight.
          const isHovered = screen === hoveredScreen;
          const targetScale = hoveredScreen
            ? isHovered
              ? HOVER_SCALE
              : NEIGHBOR_SCALE
            : 1;
          const hoverSmoothing =
            1 - Math.exp(-HOVER_TRANSITION_SMOOTHING * deltaTime);
          screen.currentScale = THREE.MathUtils.lerp(
            screen.currentScale,
            targetScale,
            hoverSmoothing,
          );
          screen.mesh.scale.setScalar(screen.currentScale);

          const targetColor =
            hoveredScreen && !isHovered
              ? screen.baseColor
                  .clone()
                  .lerp(NEIGHBOR_DIM_COLOR, NEIGHBOR_DIM_AMOUNT)
              : screen.baseColor;
          screen.mesh.material.color.lerp(targetColor, hoverSmoothing);
        }

        if (debugMode) povPosition.copy(eyeGizmo.position);

        cameraPositionReadout.textContent =
          `mode: ${povMode ? "POV" : "orbit"}\n` +
          `eye height (y): ${camera.position.y.toFixed(3)}\n` +
          `camera position: ${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)}` +
          (debugMode
            ? `\ngizmo eye pos: ${eyeGizmo.position.x.toFixed(2)}, ${eyeGizmo.position.y.toFixed(2)}, ${eyeGizmo.position.z.toFixed(2)}`
            : "");

        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
