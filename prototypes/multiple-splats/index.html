<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype • Multiple Splats</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
      }

      a,
      footer {
        color: #797979;
      }

      footer {
        position: fixed;
        margin: 10px;
        bottom: 0;
        left: 0;
      }
    </style>
  </head>

  <body>
    <footer><a href="../../index.html">&larr; back to prototypes</a></footer>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0, 6.5);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(new THREE.Color(0xffffff), 1);

      const spark = new SparkRenderer({ renderer });
      scene.add(spark);

      document.body.appendChild(renderer.domElement);

      window.addEventListener("resize", onWindowResize, false);
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      const butterflies = [];
      for (let i = 0; i < 6; i++) {
        const splat = new SplatMesh({
          url: "../../assets/splats/butterfly.spz",
        });
        splat.quaternion.set(1, 0, 0, 0);
        scene.add(splat);
        butterflies.push(splat);
      }

      const centerpiece = new SplatMesh({ url: "../../assets/splats/mom.spz" });
      centerpiece.quaternion.set(0, 0, 0, 0);
      centerpiece.scale.setScalar(0.5);
      let baseline = 0.5;
      centerpiece.position.set(0, baseline, 0);
      scene.add(centerpiece);

      // Setup mouse controls to orbit the camera around
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.minDistance = 0.3;
      controls.maxDistance = 20;
      controls.update();

      const RADIUS = 2;

      renderer.setAnimationLoop(function animate(time) {
        controls.update();

        for (let i = 0; i < butterflies.length; i++) {
          const ang = -time / 10000 + (i / butterflies.length) * Math.PI * 2;
          butterflies[i].position.set(
            Math.cos(ang) * RADIUS,
            Math.sin(ang) * RADIUS - 0.2,
            0,
          );
          butterflies[i].rotation.y = i + time / 4000;
        }

        centerpiece.position.y =
          baseline + (-0.8 + Math.sin(time / 1000) * 0.1);

        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
