<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sam Proctor</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #121212;
      }

      .scroll-spacer {
        height: 900vh;
      }

      .scene-window {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: #000;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .scene-window canvas {
        display: block;
        cursor: none;
      }

      .cursor-dot {
        position: fixed;
        top: 0;
        left: 0;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 50%;
        background: #ffffff;
        pointer-events: none;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .title-block {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1;
        padding: 24px 32px 64px;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.45) 0%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0) 100%
        );
        text-align: left;
      }

      .site-title {
        margin: 0;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: clamp(18px, 2.4vw, 26px);
        font-weight: 300;
        letter-spacing: 0.2em;
      }

      .site-subtitle {
        margin: 6px 0 0;
        color: #ffffff;
        font-family: Helvetica, Arial, sans-serif;
        font-size: clamp(10px, 1.2vw, 13px);
        font-weight: 400;
        letter-spacing: 0.15em;
      }

      .intro {
        position: fixed;
        left: 32px;
        bottom: 64px;
        z-index: 1;
        max-width: 420px;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        opacity: 0;
        transform: translateY(24px);
        transition: opacity 0.4s ease-out, transform 0.4s ease-out;
      }

      .intro.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .intro-heading {
        margin: 0 0 12px;
        font-size: clamp(32px, 5vw, 56px);
        font-weight: 300;
        letter-spacing: 0.03em;
      }

      .intro-body {
        margin: 0;
        font-size: clamp(13px, 1.4vw, 15px);
        font-weight: 400;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="scene-window"></div>

    <div class="title-block">
      <h1 class="site-title">SAM PROCTOR</h1>
    </div>

    <div class="intro">
      <h2 class="intro-heading">Hi, I'm Sam.</h2>
      <p class="intro-body">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do
        eiusmod tempor incididunt ut labore et dolore magna aliqua.
      </p>
    </div>

    <div class="cursor-dot"></div>

    <div class="scroll-spacer"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
