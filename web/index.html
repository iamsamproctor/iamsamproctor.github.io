<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sam Proctor</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 0;
        cursor: none;
      }

      .title-block {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1;
        padding: 24px 32px 64px;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 0, 0, 0.4) 60%,
          rgba(0, 0, 0, 0) 100%
        );
        text-align: center;
      }

      .site-title {
        margin: 0;
        color: #ffffff;
        font-family: Helvetica, Arial, sans-serif;
        font-size: clamp(18px, 2.4vw, 26px);
        font-weight: 600;
        letter-spacing: 0.2em;
      }

      .site-subtitle {
        margin: 6px 0 0;
        color: #ffffff;
        font-family: Helvetica, Arial, sans-serif;
        font-size: clamp(10px, 1.2vw, 13px);
        font-weight: 400;
        letter-spacing: 0.15em;
      }
    </style>
  </head>
  <body>
    <div class="title-block">
      <h1 class="site-title">SAM PROCTOR</h1>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
